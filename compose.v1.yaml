services:
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "80:8080"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - frontend

  web:
    build: ./web
    image: mysite:1.1
    restart: unless-stopped
    networks:
      - frontend

  api:
    image: traefik/whoami:latest
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
