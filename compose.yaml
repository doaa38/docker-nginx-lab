x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 128m
  pids_limit: 100

services:
  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "80:8080"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - frontend

  web:
    <<: *hardening
    build: ./web
    image: mysite:1.1
    networks:
      - frontend

  api:
    <<: *hardening
    image: traefik/whoami:latest
    networks:
      - frontend

networks:
  frontend:
